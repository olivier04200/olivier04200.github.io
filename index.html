<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olivier — Applications</title>
<meta name="description" content="Les applications mobiles d'Olivier : Recivo, et les suivantes.">
<style>
  :root { --ink: #2b2430; --sub: #6b6372; --accent: #7c5fb0; --bg: #faf8fc; --card: #ffffff; --border: #e8e2ef; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #ece7f2; --sub: #a79fb3; --accent: #b9a3e3; --bg: #17131c; --card: #201a28; --border: #352c42; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  h1 { font-size: 26px; margin: 10px 0 4px; }
  .sub { color: var(--sub); font-size: 14px; margin-bottom: 30px; }
  a.app { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin: 14px 0; text-decoration: none; color: var(--ink); transition: transform .1s; }
  a.app:hover { transform: translateY(-2px); }
  .emoji { font-size: 36px; }
  .name { font-weight: 700; font-size: 18px; margin-top: 4px; }
  .desc { color: var(--sub); font-size: 14px; }
  .links { font-size: 13px; margin-top: 8px; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="emoji">👋</div>
  <h1>Mes applications</h1>
  <div class="sub">Développées en indépendant — 100 % locales, sans pub, sans collecte de données.</div>

  <a class="app" href="./recivo/">
    <div class="emoji">🍽️</div>
    <div class="name">Recivo</div>
    <div class="desc">Tes recettes, importées d'Instagram ou d'ailleurs, organisées — planificateur, listes de courses, mode cuisine.</div>
    <div class="links">Politique de confidentialité →</div>
  </a>

  <!-- Prochaines apps : dupliquer le bloc ci-dessus (ex. Kartino) -->
</div>
</body>
</html>
